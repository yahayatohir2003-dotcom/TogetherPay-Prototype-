name: Build TogetherPay APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        run: npm install --no-audit --no-fund

      - name: Copy the app files into www
        run: | mkdir -p www cp index.html styles.css data.js state.js screens.js app.js www/ 
      - name: Create the Android project
        run: | [ -d android ] || npx cap add android npx cap sync android 
      - name: Create app icons (optional)
        run: | pip install pillow > /dev/null 2>&1 && python3 make_icons.py || echo "Icons skipped, default icon will be used" 
      - name: Accept Android licences and install SDK 36
        run: | yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true 
      - name: Build the APK
        working-directory: android
        run: | chmod +x gradlew ./gradlew assembleDebug --no-daemon 
      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: TogetherPay-Prototype-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
